<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apps by Martin Kiperszmid</title>
<meta name="description" content="Privacy policies and support pages for apps by Martin Kiperszmid.">
<style>
  :root { --bg: #F6F7FB; --fg: #14182B; --fg2: #4A5070; --rule: rgba(20, 24, 43, .12); --link: #2443C4; color-scheme: light; }
  @media (prefers-color-scheme: dark) { :root { --bg: #10131F; --fg: #E9EDFB; --fg2: #B3BAD6; --rule: rgba(255, 255, 255, .12); --link: #9DB0F5; color-scheme: dark; } }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 400 17px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding-inline: 20px; padding-block: 56px; }
  h1 { font-size: 30px; line-height: 1.15; margin: 0; }
  p { color: var(--fg2); margin: 10px 0 0; }
  ul { list-style: none; padding: 0; margin: 32px 0 0; border-top: 1px solid var(--rule); }
  li { padding: 16px 0; border-bottom: 1px solid var(--rule); display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: baseline; }
  li strong { min-width: 7em; }
  a { color: var(--link); text-underline-offset: 3px; }
</style>
</head>

<main>
  <h1>Apps by Martin Kiperszmid</h1>
  <p>Privacy policies and support for each app. Contact: <a href="mailto:devkiperszmid@gmail.com">devkiperszmid@gmail.com</a></p>
